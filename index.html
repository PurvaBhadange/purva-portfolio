              gl.uniform1f(U.puffAmt, puffNow);
              gl.uniform1f(U.kissAmt, kissNow);
              gl.uniform1f(U.blushAmt, blushNow);
              gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
            }

            (async () => {
              const base = await load('rest');
              if (!base) return;
              const cutBase = cutoutPortrait(base, null);
              const anchor = measureHead(cutBase);
              upload('rest', cutBase);
              hitMap(cutBase);
              document.getElementById('faceFallback').style.visibility = 'hidden';
              ready = true; tStart = performance.now(); nextBlink = tStart + 2400; requestAnimationFrame(frame);
              await Promise.all(['closed', 'smile', 'wink', 'shock'].map(async n => {
                const img = await load(n);
                if (img) upload(n, cutoutPortrait(img, anchor));
              }));
            })();
          })();
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => requestAnimationFrame(init));
        } else {
          requestAnimationFrame(init);
        }
      })();
    </script>
  </body>
</html>
